name: Secret scan

# Periodic + push-time secret scanning with gitleaks. Catches leaked keys,
# tokens, and private keys across the full git history (not just HEAD).
# Runs on push to main, every PR, and weekly on Monday at 09:00 UTC.
#
# To enable: add `GITLEAKS_LICENSE` to repo secrets (Pro) OR rely on the
# default free OSS mode (slightly noisier false-positive rate).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # required by gitleaks-action to comment on PRs

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add gitleaks config (tighten defaults for this repo)
        run: |
          cat > .gitleaks.toml <<'TOML'
          # PSE Distribution — gitleaks configuration
          # Skips vendored packet and the published inventory snapshot fixtures.
          title = "PSE Distribution"
          [extend]
          useDefault = true
          TOML

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Don't scan the vendored packet, generated data, or our own CI
          GITLEAKS_CONFIG: .gitleaks.toml
