<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Pilot Sales Distribution</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #1a7b6b;
            --primary-dark: #0f4f43;
            --primary-light: #e8f5f0;
            --secondary: #0b2a3b;
            --accent: #f1c40f;
            --text-light: #6a889a;
            --white: #ffffff;
            --radius: 1.5rem;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        
        .error-container { text-align: center; max-width: 500px; }
        .error-container .code { font-size: 8rem; font-weight: 900; color: #1a7b6b; line-height: 1; }
        .error-container .logo { width: 80px; height: 80px; margin: 0 auto 1rem; }
        .error-container .logo img { width: 100%; height: 100%; object-fit: contain; }
        .error-container h2 { font-size: 1.8rem; color: #0b2a3b; margin: 0.5rem 0; }
        .error-container p { color: #6a889a; margin-bottom: 1.5rem; }
        .error-container .btn-home { display: inline-block; background: #1a7b6b; color: #fff; padding: 0.7rem 2.5rem; border-radius: 50px; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .error-container .btn-home:hover { background: #0f4f43; transform: translateY(-2px); }
        
        @media (max-width: 480px) {
            .error-container .code { font-size: 5rem; }
            .error-container h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <img src="logo.jpg" alt="Pilot Sales Distribution" />
        </div>
        <div class="code">404</div>
        <h2>Page Not Found</h2>
        <p>Oops! The page you're looking for doesn't exist or has been moved.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
            <a href="home" class="btn-home">🏠 Back to Home</a>
            <a href="products" class="btn-home" style="background:#0b2a3b;">Browse Products</a>
        </div>
    </div>
</body>
</html>
