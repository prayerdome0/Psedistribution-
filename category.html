<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category — Pilot Sales Distribution</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <script src="main.js"></script>
    <script src="/inventory-client.js"></script>
    <style>
        .category-hero {
            background: linear-gradient(135deg, var(--secondary), #0d384c);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
        }
        .category-hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
        }
        .category-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
        }
        .category-stats {
            display: flex;
            gap: 2rem;
            margin-top: 1.5rem;
        }
        .category-stats .stat {
            background: rgba(255,255,255,0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
        }
    </style>
    <script src="/marketplace.js"></script>
    <link rel="stylesheet" href="/marketplace-core.css" />
</head>
<body>

<!-- TOP BAR + HEADER (same as other pages) -->
<div class="top-bar">
    <div class="container">
        <div class="moving-words">
            <div class="words-track">
                <span><i class="fa-solid fa-bolt"></i> Wholesale Inventory. Verified Before You Buy.</span>
            </div>
        </div>
        <div class="top-links">
            <a href="/products">All Products</a>
            <a href="/rfq">RFQ</a>
            <a href="/login">Login</a>
        </div>
    </div>
</div>

<header class="header">
    <div class="container">
        <a href="/" class="logo">
            <img src="/logo.webp" alt="PSE Distribution">
            <div class="brand-name">
                <span class="main">PSE <span>Distribution</span></span>
            </div>
        </a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search this category...">
            <button><i class="fa-solid fa-search"></i></button>
        </div>
        <div class="header-actions">
            <a href="/cart" class="icon-btn"><i class="fa-solid fa-cart-shopping"></i></a>
            <a href="/wishlist" class="icon-btn"><i class="fa-regular fa-heart"></i></a>
        </div>
    </div>
</header>

<!-- CATEGORY HERO -->
<div class="category-hero">
    <div class="container">
        <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
            <div>
                <span class="eyebrow" style="background:rgba(255,255,255,0.15);color:#fff;">Category</span>
                <h1 id="categoryTitle">Category</h1>
                <p id="categoryDescription">Browse verified wholesale products in this category.</p>
            </div>
            <div class="category-stats">
                <div class="stat"><strong id="categoryCount">0</strong> Products</div>
                <div class="stat"><strong id="categorySuppliers">—</strong> Suppliers</div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <!-- Filters -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
        <div>
            <select id="sortSelect" onchange="applyCategoryFilters()" style="padding:0.5rem 1rem; border-radius:8px; border:1px solid var(--border);">
                <option value="default">Sort: Best Match</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="newest">Recently Updated</option>
            </select>
        </div>
        <div>
            <button onclick="clearCategoryFilters()" style="background:#fff; border:1px solid var(--border); padding:0.5rem 1.2rem; border-radius:30px; cursor:pointer;">
                Clear Filters
            </button>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="product-grid product-grid-2col professional-2" id="categoryProductGrid">
        <div class="loading-spinner">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Loading products...</p>
        </div>
    </div>
</div>

<script>
    let allCategoryProducts = [];
    let currentCategory = '';

    async function loadCategoryProducts() {
        const params = new URLSearchParams(window.location.search);
        currentCategory = params.get('cat') || params.get('category') || 'electronics';
        
        const titleEl = document.getElementById('categoryTitle');
        const descEl = document.getElementById('categoryDescription');
        
        titleEl.textContent = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);
        descEl.textContent = `Verified wholesale ${currentCategory} products with confirmed availability.`;

        try {
            const response = await fetch(`/api/inventory?category=${encodeURIComponent(currentCategory)}&limit=100`);
            const data = await response.json();
            
            allCategoryProducts = (data.data || []).map(item => ({
                ...item,
                slug: item.slug || item.title?.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                price: item.pricingMode === 'public' ? item.publicUnitPrice : null
            }));

            document.getElementById('categoryCount').textContent = allCategoryProducts.length;
            renderCategoryProducts(allCategoryProducts);
        } catch (e) {
            console.error(e);
            document.getElementById('categoryProductGrid').innerHTML = 
                `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#64748b;">No products found in this category.</div>`;
        }
    }

    function renderCategoryProducts(products) {
        const grid = document.getElementById('categoryProductGrid');
        if (!products.length) {
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;">No products available.</div>`;
            return;
        }

        grid.innerHTML = products.map(p => {
            const price = p.price ? '$' + Number(p.price).toFixed(2) : 'Quote required';
            const slug = p.slug || '';
            return `
                <div class="product-card">
                    <div class="product-image" onclick="window.location.href='/product/${encodeURIComponent(slug)}'">
                        <img src="${p.image_url || p.imageUrls?.[0] || '/logo.webp'}" alt="${p.title}" loading="lazy" onerror="this.src='/logo.webp'">
                    </div>
                    <div class="product-title">${p.title}</div>
                    <div class="product-brand">${p.brand || 'Pilot Distribution'}</div>
                    <div class="product-price">${price}</div>
                    <div class="product-actions">
                        <a href="/product/${encodeURIComponent(slug)}" class="btn-add" style="text-align:center;text-decoration:none;">
                            <i class="fa-regular fa-eye"></i> Details
                        </a>
                        <a href="/rfq?dealId=${p.dealId || ''}" class="btn-add" style="background:var(--primary);text-align:center;text-decoration:none;">
                            <i class="fa-regular fa-file-lines"></i> RFQ
                        </a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function applyCategoryFilters() {
        const sort = document.getElementById('sortSelect').value;
        let filtered = [...allCategoryProducts];

        if (sort === 'price-asc') {
            filtered.sort((a, b) => (a.price || Infinity) - (b.price || Infinity));
        } else if (sort === 'price-desc') {
            filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
        } else if (sort === 'newest') {
            filtered.sort((a, b) => new Date(b.lastAvailabilityConfirmedAt || 0) - new Date(a.lastAvailabilityConfirmedAt || 0));
        }

        renderCategoryProducts(filtered);
    }

    function clearCategoryFilters() {
        document.getElementById('sortSelect').value = 'default';
        renderCategoryProducts(allCategoryProducts);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadCategoryProducts();
        
        // Search within category
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                const filtered = allCategoryProducts.filter(p => 
                    p.title?.toLowerCase().includes(query) || 
                    p.brand?.toLowerCase().includes(query)
                );
                renderCategoryProducts(filtered);
            });
        }
    });
</script>

<script src="quickview.js"></script>
</body>
</html>
