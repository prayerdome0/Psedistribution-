<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline — Pilot Sales Distribution</title>
    <meta name="description" content="You're currently offline. Your browsing is protected — reconnect to keep shopping wholesale on Pilot Sales Distribution." />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap&family=Montserrat:wght@300;400;500;600;700;800;900" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0b2138 0%, #0a5a4a 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #0b2138;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 440px; width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
        }
        .card img { width: 90px; margin-bottom: 1rem; }
        .icon {
            width: 76px; height: 76px; border-radius: 50%;
            background: #e6f4ef; color: #0e7c68;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2rem; margin-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        p { color: #698093; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.4rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: #0e7c68; color: #fff; border: none;
            padding: 0.8rem 2rem; border-radius: 50px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            font-family: inherit; text-decoration: none;
        }
        .btn:hover { background: #0a5a4a; }
        .tip { margin-top: 1.2rem; font-size: 0.72rem; color: #9db4c2; }
        .wa { display: inline-block; margin-top: 0.8rem; color: #075e54; font-weight: 700; font-size: 0.85rem; text-decoration: none; }
    </style>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="card">
        <img src="/logo.webp" alt="Pilot Sales Distribution" onerror="this.style.display='none'" />
        <div class="icon"><i class="fa-solid fa-wifi" style="text-decoration: line-through;"></i></div>
        <h1>You're Offline</h1>
        <p>No internet connection detected. Pages you've visited recently stay available from cache — reconnect to keep browsing the full wholesale catalog, place orders and track shipments.</p>
        <button class="btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> Try Again</button>
        <br />
        <a class="wa" href="https://wa.me/19099384682" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Chat with us on WhatsApp</a>
        <div class="tip">Pilot Sales Distribution · Progressive Web App</div>
    </div>
</body>
</html>
