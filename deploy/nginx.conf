# ─────────────────────────────────────────────────────────────────────────────
# Pilot Sales Distribution — nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
# Production-grade nginx config for the static storefront. Pairs with the
# Dockerfile in this directory. Mirror the security headers in vercel.json
# for self-hosted / on-prem deployments.
# ─────────────────────────────────────────────────────────────────────────────

# Run as the unprivileged "nginx" user (matches Dockerfile USER)
user nginx;

# One worker per CPU core, capped at 8
worker_processes auto;
worker_rlimit_nofile 65535;

# Hide nginx version from Server header
pid /var/run/nginx.pid;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Performance
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;        # Hide "Server: nginx" version

    # Logging (json for log shippers; switch to basic for local dev)
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"req_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"ua":"$http_user_agent",'
            '"ref":"$http_referer"'
        '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-web-app-manifest+json
        font/opentype
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limit zone: 10 req/sec per IP for the API, 5 req/sec for everything
    # else. Real rate limits live in the inventory API; this is a coarse
    # DDoS shield for the static site.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
    limit_req_status 429;

    # Upstream for the inventory API. Overridable via env at deploy time.
    upstream inventory_api {
        # The inventory service runs in its own container; replace this IP
        # with the docker-compose service name or the K8s cluster IP.
        server inventory:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Document root
        root /usr/share/nginx/html;
        index index.html;

        # ─── SECURITY HEADERS ─────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # CSP — match vercel.json so behaviour is consistent across Vercel
        # and self-hosted. Allow the preview iframe hosts for Arena / E2B.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://*.firebaseio.com https://*.firebaseapp.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://api.resend.com https://formsubmit.co; base-uri 'none'; form-action 'self' https://formsubmit.co; frame-ancestors 'self' https://*.e2b.app https://*.arena.ai https://pilotsalesdistribution.com" always;
        # HSTS — only enable when serving over HTTPS in production.
        # Uncomment the line below once TLS is configured.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ─── HIDDEN PATHS (defence in depth) ─────────────────────
        # The deploy should also .dockerignore these, but block them in nginx
        # in case the image is built from a working tree that included them.
        location ~ ^/(services|vendor|docs|tests|scripts|apps|\.git|\.env|firebase\.json|firestore\.rules|PSE_SalesMax) {
            deny all;
            return 404;
        }

        # ─── INTERNAL API SURFACES (never public) ────────────────
        location ~ ^/api/internal/ {
            # Match Caddy rule: private control-plane routes must be
            # called from a publisher job on the private network, not a browser.
            return 404;
        }

        # ─── INVENTORY API PROXY ────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://inventory_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ─── CLEAN URLS (mirror vercel.json rewrites) ───────────
        location = / { try_files /index.html =404; }
        location = /home { return 301 /; }
        location = /index { return 301 /; }

        location /products { try_files $uri $uri/ /products.html; }
        location /product  { try_files $uri $uri/ /product-detail.html; }
        location /product-detail { try_files $uri $uri/ /product-detail.html; }
        location /cart { try_files $uri $uri/ /cart.html; }
        location /checkout { try_files $uri $uri/ /checkout.html; }
        location /login { try_files $uri $uri/ /login.html; }
        location /register { try_files $uri $uri/ /register.html; }
        location /forgot-password { try_files $uri $uri/ /forgot-password.html; }
        location /forgot { try_files $uri $uri/ /forgot-password.html; }
        location /reset-password { try_files $uri $uri/ /forgot-password.html; }
        location /account { try_files $uri $uri/ /account.html; }
        location /admin-dashboard { try_files $uri $uri/ /admin-dashboard.html; }
        location /admin { try_files $uri $uri/ /admin-dashboard.html; }
        location /seller-dashboard { try_files $uri $uri/ /seller-dashboard.html; }
        location /seller { try_files $uri $uri/ /seller-dashboard.html; }
        location /buyer-dashboard { try_files $uri $uri/ /buyer-dashboard.html; }
        location /about { try_files $uri $uri/ /about.html; }
        location /contact { try_files $uri $uri/ /contact.html; }
        location /help-center { try_files $uri $uri/ /help-center.html; }
        location /help { try_files $uri $uri/ /help-center.html; }
        location /privacy { try_files $uri $uri/ /privacy.html; }
        location /terms { try_files $uri $uri/ /terms.html; }
        location /track-order { try_files $uri $uri/ /track-order.html; }
        location /become-seller { try_files $uri $uri/ /become-seller.html; }
        location /order-success { try_files $uri $uri/ /order-success.html; }
        location /wishlist { try_files $uri $uri/ /wishlist.html; }
        location /chat { try_files $uri $uri/ /chat.html; }
        location /rfq { try_files $uri $uri/ /rfq.html; }
        location /supplier-verification { try_files $uri $uri/ /supplier-verification.html; }
        location /verify { try_files $uri $uri/ /verify.html; }
        location /catalogs { try_files $uri $uri/ /catalogs.html; }
        location /supplier-store { try_files $uri $uri/ /supplier-store.html; }
        location /offline { try_files $uri $uri/ /offline.html; }
        location /500 { try_files /500.html =500; }
        location /error { try_files /500.html =500; }

        # ─── ERROR PAGES ────────────────────────────────────────
        error_page 404 /404.html;
        error_page 500 502 503 504 /500.html;
        # When the 500 page itself is missing, serve a minimal text response
        # so the user never sees a useless "nginx 500" page.
        location = /500.html {
            internal;
        }
        location = /404.html {
            internal;
        }

        # ─── STATIC ASSETS (long-lived cache, immutable) ────────
        location ~* \.(css|js|webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;        # Don't fill logs with image requests
        }

        # PWA / robots / sitemap — short cache
        location ~* (manifest\.json|robots\.txt|sitemap\.xml|browserconfig\.xml) {
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Service worker — must NOT be cached aggressively (cache-bust on
        # deploys by bumping CACHE_VERSION in sw.js)
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
        }

        # Coarse rate limit on all other traffic
        location / {
            limit_req zone=site burst=50 nodelay;
            try_files $uri $uri/ $uri.html /index.html;
        }
    }
}
